<p-card header="Entidades">
  <p-toast />
  <p-toolbar styleClass="mb-4 gap-2">
    <ng-template pTemplate="left">
      <p-button severity="success" label="Nueva" icon="pi pi-plus" class="mr-2" (onClick)="openNew()" />
      <p-button severity="danger" label="Eliminar" icon="pi pi-trash" badge="{{selectedEntidades.length}}" (onClick)="deleteSelected()" />
    </ng-template>
  </p-toolbar>

  <p-table #dt [value]="entidadesService.entidades()" [rows]="10" [paginator]="true"
           [globalFilterFields]="['nombre', 'nit', 'telefono', 'direccion']"
           [tableStyle]="{ 'min-width': '75rem' }"
           [rowHover]="true" dataKey="id"
           currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
           [showCurrentPageReport]="true" [loading]="entidadesService.loading()"
           [(selection)]="selectedEntidades">

    <ng-template pTemplate="caption">
      <div class="flex align-items-center justify-content-between">
        <h5 class="m-0">Lista de entidades</h5>
        <span class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <input pInputText type="text" placeholder="Buscar..." />
        </span>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
        <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre" /></th>
        <th>NIT</th>
        <th pSortableColumn="telefono">Teléfono <p-sortIcon field="telefono" /></th>
        <th pSortableColumn="direccion">Dirección <p-sortIcon field="direccion" /></th>
        <th>Opciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-entidad>
      <tr>
        <td><p-tableCheckbox [value]="entidad" /></td>
        <td>{{ entidad.nombre }}</td>
        <td>{{ entidad.nit }}</td>
        <td>{{ entidad.telefono }}</td>
        <td>{{ entidad.direccion }}</td>
        <td>
          <p-button icon="pi pi-pencil" class="mr-2" severity="success" [rounded]="true" [outlined]="true" (onClick)="edit(entidad)" />
          <p-button icon="pi pi-trash" class="mr-2" severity="danger" [rounded]="true" [outlined]="true" (onClick)="deleteEntidad(entidad)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="summary">
      <div class="flex align-items-center justify-content-between">
        Total {{ total() }} entidades.
      </div>
    </ng-template>
  </p-table>
</p-card>

<p-dialog [(visible)]="entidadDialog" [modal]="true" [style]="{ width: '30rem' }"
          header="{{ editingEntidad ? 'Editar Entidad' : 'Nueva Entidad' }}" [closable]="true">
  <form [formGroup]="entidadForm" (ngSubmit)="saveEntidad()">
    <div class="p-fluid">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" pInputText formControlName="nombre" />
      </div>

      <div class="field">
        <label for="nit">NIT</label>
        <input id="nit" type="text" pInputText formControlName="nit" />
      </div>

      <div class="field">
        <label for="telefono">Teléfono</label>
        <input id="telefono" type="text" pInputText formControlName="telefono" />
      </div>

      <div class="field">
        <label for="direccion">Dirección</label>
        <input id="direccion" type="text" pInputText formControlName="direccion" />
      </div>
    </div>

    <div class="p-dialog-footer pt-4 flex justify-end gap-2">
      <button pButton type="button" label="Cancelar" icon="pi pi-times" (click)="entidadDialog = false"></button>
      <button pButton type="submit" label="Guardar" icon="pi pi-check" [disabled]="entidadForm.invalid"></button>
    </div>
  </form>
</p-dialog>
