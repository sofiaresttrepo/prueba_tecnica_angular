<p-card header="Contactos">
  <p-toast></p-toast>

  <!-- Botón para nuevo contacto -->
  <button pButton type="button" label="Nuevo contacto" icon="pi pi-plus" class="mb-3" (click)="openNew()"></button>

  <!-- Tabla de contactos -->
  <p-table [value]="contactos" [paginator]="true" [rows]="5" [rowHover]="true" [responsiveLayout]="'scroll'">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Email</th>
        <th>Teléfono</th>
        <th>Dirección</th>
        <th>Notas</th>
        <th>Entidad</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-contacto>
      <tr>
        <td>{{ contacto.nombre }}</td>
        <td>{{ contacto.email }}</td>
        <td>{{ contacto.telefono }}</td>
        <td>{{ contacto.direccion }}</td>
        <td>{{ contacto.notas }}</td>
        <td>{{ contacto.entidad_id }}</td>
        <td>
          <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text"
            (click)="editContacto(contacto)"></button>
          <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger p-button-text"
            (click)="deleteContacto(contacto)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Diálogo para crear/editar contacto -->
  <p-dialog [(visible)]="contactoDialog" [modal]="true" [style]="{width: '30rem'}" [closable]="true"
    [dismissableMask]="true" header="{{ editingContacto ? 'Editar Contacto' : 'Nuevo Contacto' }}">
    <form [formGroup]="contactoForm" (ngSubmit)="saveContacto()">
      <div class="p-fluid grid">
        <div class="field col-12 md:col-6">
          <label for="nombre" class="font-bold">Nombre</label>
          <input id="nombre" type="text" pInputText formControlName="nombre" placeholder="Nombre"
            [ngClass]="{'ng-invalid ng-dirty': contactoForm.get('nombre')?.invalid && contactoForm.get('nombre')?.touched}" />
          <small class="p-error"
            *ngIf="contactoForm.get('nombre')?.hasError('required') && contactoForm.get('nombre')?.touched">
            El nombre es obligatorio.
          </small>
        </div>
        <div class="field col-12 md:col-6">
          <label for="email" class="font-bold">Email</label>
          <input id="email" type="email" pInputText formControlName="email" placeholder="Email"
            [ngClass]="{'ng-invalid ng-dirty': contactoForm.get('email')?.invalid && contactoForm.get('email')?.touched}" />
          <small class="p-error"
            *ngIf="contactoForm.get('email')?.hasError('email') && contactoForm.get('email')?.touched">
            Debe ingresar un email válido.
          </small>
        </div>
        <div class="field col-12 md:col-6">
          <label for="telefono" class="font-bold">Teléfono</label>
          <input id="telefono" type="text" pInputText formControlName="telefono" placeholder="Teléfono" />
        </div>
        <div class="field col-12 md:col-6">
          <label for="direccion" class="font-bold">Dirección</label>
          <input id="direccion" type="text" pInputText formControlName="direccion" placeholder="Dirección" />
        </div>
        <div class="field col-12">
          <label for="notas" class="font-bold">Notas</label>
          <textarea id="notas" pInputTextarea formControlName="notas" rows="2" placeholder="Notas"></textarea>
        </div>
        <div class="field col-12">
          <label for="entidad_id" class="font-bold">Entidad</label>
          <p-dropdown [options]="entidades" optionLabel="nombre" optionValue="id" formControlName="entidad_id"
            placeholder="Seleccione una entidad"
            [ngClass]="{'ng-invalid ng-dirty': contactoForm.get('entidad_id')?.invalid && contactoForm.get('entidad_id')?.touched}">
          </p-dropdown>
          <small class="p-error"
            *ngIf="contactoForm.get('entidad_id')?.hasError('required') && contactoForm.get('entidad_id')?.touched">
            Debe seleccionar una entidad.
          </small>
        </div>
      </div>
      <div class="p-dialog-footer pt-4 flex justify-end gap-2">
        <button pButton type="button" label="Cancelar" icon="pi pi-times" class="p-button-text"
          (click)="contactoDialog = false"></button>
        <button pButton type="submit" label="Guardar" icon="pi pi-check" [disabled]="contactoForm.invalid"></button>
      </div>
    </form>
  </p-dialog>
</p-card>
